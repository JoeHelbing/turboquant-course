[project]
name = "turboquant-course"
version = "0.1.0"
description = "Interactive deep-dive course: TurboQuant vector quantization"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "plotly>=5.18",
    "jupyter>=1.0",
    "ipywidgets>=8.0",
    "rich>=13.0",
    "polars>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
